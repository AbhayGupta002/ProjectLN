# ===================================================================
# PRODUCTION PROFILE CONFIGURATION
# ===================================================================

server.port=${PORT:8080}
spring.application.name=backend

# ===================================================================
# TiDB CLOUD / MYSQL DATABASE CONFIGURATION
# ===================================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Cloud Connection Pool & Keep-Alive (Prevents stale socket drops and 30s freezes)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=/* ping */ SELECT 1
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true

# ===================================================================
# JPA & HIBERNATE
# ===================================================================

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===================================================================
# MONGODB CONFIGURATION
# ===================================================================

spring.data.mongodb.uri=${MONGO_URI}

# ===================================================================
# MAIL CONFIGURATION
# ===================================================================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.starttls.enable=true

# ===================================================================
# RAZORPAY PAYMENT GATEWAY
# ===================================================================

razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}

# ===================================================================
# SECURITY & JWT
# ===================================================================

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================================================
# CORS CONFIGURATION
# ===================================================================

app.cors.frontend-url=${FRONTEND_URL}
app.backend.url=${BACKEND_URL:https://world-tour-app-onc4.onrender.com}

# ===================================================================
# AI / LLM PROVIDER CONFIGURATION
# ===================================================================

ai.provider=${AI_PROVIDER:ollama}

# OpenAI
openai.api.key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-3.5-turbo}

# Gemini
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}

# Ollama
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:llama3}

# ===================================================================
# REDIS CONFIGURATION
# ===================================================================

spring.cache.type=${CACHE_TYPE:simple}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ===================================================================
# HEALTH MONITORING
# ===================================================================

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.info.env.enabled=false
management.health.mail.enabled=false

# ===================================================================
# LOGGING
# ===================================================================

logging.level.org.springframework.security=INFO
logging.level.com.example.personalassistant=INFO