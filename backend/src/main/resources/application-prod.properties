
# ===================================================================
# PRODUCTION PROFILE CONFIGURATION
# Requires: SPRING_PROFILES_ACTIVE=prod
# ===================================================================

server.port=${PORT:8080}
spring.application.name=backend

# ===================================================================
# MYSQL DATABASE CONFIGURATION
# ===================================================================
# Required environment variables:
# DB_URL
# DB_USERNAME
# DB_PASSWORD

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ===================================================================
# JPA & HIBERNATE
# ===================================================================

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===================================================================
# MONGODB
# ===================================================================

spring.data.mongodb.uri=${MONGO_URI}

# ===================================================================
# MAIL
# ===================================================================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.starttls.enable=true

# ===================================================================
# RAZORPAY PAYMENT GATEWAY
# ===================================================================

razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}

# ===================================================================
# SECURITY & JWT
# ===================================================================

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================================================
# CORS
# ===================================================================

app.cors.frontend-url=${FRONTEND_URL}

# ===================================================================
# AI / LLM PROVIDER
# ===================================================================

ai.provider=${AI_PROVIDER:ollama}

openai.api.key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-3.5-turbo}

gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}

ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:llama3}

# ===================================================================
# REDIS
# ===================================================================

spring.cache.type=${CACHE_TYPE:simple}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ===================================================================
# HEALTH MONITORING & LOGGING
# ===================================================================

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.info.env.enabled=false
management.health.mail.enabled=false

logging.level.org.springframework.security=INFO
logging.level.com.example.personalassistant=INFO

