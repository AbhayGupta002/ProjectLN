# ===================================================================
# LOCAL / STANDALONE TEST PROFILE (H2 In-Memory)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:worldtourdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create

app.jwt.secret=LocalDevelopmentSecretKeyWithAtLeast32BytesForHMACSHA256!
app.jwt.expiration-ms=86400000

spring.data.mongodb.repositories.type=none
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

razorpay.key-id=rzp_test_localKey123
razorpay.key-secret=rzp_test_secretKey456
