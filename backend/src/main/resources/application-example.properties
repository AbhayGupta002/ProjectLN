# ===================================================================
# SERVER CONFIGURATION
# ===================================================================
server.port=${PORT:8080}
spring.application.name=backend

# ===================================================================
# DATABASE CONFIGURATION (MySQL)
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/testdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:ag4035737@}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# JPA & Hibernate
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===================================================================
# MONGODB CONFIGURATION (Chat Logs & Analytics)
# ===================================================================
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/ProjectLN}

# ===================================================================
# MAIL CONFIGURATION
# ===================================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:hotelluxnes@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000

# ===================================================================
# PAYMENT GATEWAY (Razorpay)
# ===================================================================
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:placeholder_secret}

# ===================================================================
# SECURITY & JWT
# ===================================================================
app.jwt.secret=${JWT_SECRET:LuxNesSecretKeyMustBeAtLeast256BitsLongForHMACSHA256Security123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================================================
# AI & LLM PROVIDER CONFIGURATION
# ===================================================================
# Provider choice: ollama | openai | gemini | mock
ai.provider=${AI_PROVIDER:ollama}

# OpenAI
openai.api.key=${OPENAI_KEY:${OPENAI_API_KEY:}}
openai.model=${OPENAI_MODEL:gpt-3.5-turbo}
openai.api.url=https://api.openai.com/v1/chat/completions

# Gemini
gemini.api.key=${GEMINI_KEY:${GEMINI_API_KEY:}}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}

# Ollama (Local LLM)
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:llama3}
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${OLLAMA_MODEL:llama3}

# ===================================================================
# CACHE CONFIGURATION (Redis & Simple Fallback)
# ===================================================================
spring.cache.type=${CACHE_TYPE:simple}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000

# ===================================================================
# LOGGING
# ===================================================================
logging.level.org.springframework.security=WARN
logging.level.com.example.personalassistant=INFO

# ===================================================================
# ACTUATOR & PRODUCTION HEALTH MONITORING
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.health.mail.enabled=false

logging.level.org.springframework.security=DEBUG
