# ===================================================================
# SERVER CONFIGURATION
# ===================================================================
server.port=${PORT:8080}
spring.application.name=backend

# ===================================================================
# DATABASE CONFIGURATION (MySQL)
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/testdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# MONGODB CONFIGURATION
# ===================================================================
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/ProjectLN}

# ===================================================================
# MAIL CONFIGURATION
# ===================================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# ===================================================================
# PAYMENT GATEWAY (Razorpay)
# ===================================================================
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# ===================================================================
# SECURITY & JWT
# ===================================================================
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================================================
# CORS ORIGIN CONFIGURATION
# ===================================================================
app.cors.frontend-url=${FRONTEND_URL:http://localhost:3000,http://localhost:3001}

# ===================================================================
# AI & LLM PROVIDER CONFIGURATION
# ===================================================================
ai.provider=${AI_PROVIDER:ollama}
openai.api.key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-3.5-turbo}
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:llama3}

# ===================================================================
# CACHE CONFIGURATION (Redis)
# ===================================================================
spring.cache.type=${CACHE_TYPE:simple}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
